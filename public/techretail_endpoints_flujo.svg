  <text x="32" y="87" font-size="8" fill="#64748b">Auth</text><rect x="106" y="78" width="30" height="11" rx="2" fill="#dcfce7"/><text x="121" y="87" text-anchor="middle" font-size="7" fill="#166534">GET</text>
  <text x="158" y="87" font-size="8" fill="#475569">/login</text><text x="305" y="87" font-size="8" fill="#475569">Vista del formulario de login</text>
  <rect x="20" y="91" width="472" height="15" fill="#fff"/>
  <text x="32" y="102" font-size="8" fill="#64748b">Auth</text><rect x="106" y="93" width="30" height="11" rx="2" fill="#fef9c3"/><text x="121" y="102" text-anchor="middle" font-size="7" fill="#854d0e">POST</text>
  <text x="158" y="102" font-size="8" fill="#475569">/login</text><text x="305" y="102" font-size="8" fill="#475569">Autenticar y crear sesión</text>

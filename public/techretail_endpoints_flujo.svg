  <text x="158" y="132" font-size="8" fill="#475569">/planes/vista</text><text x="305" y="132" font-size="8" fill="#475569">Vista HTML con lista de planes</text>
  <rect x="20" y="136" width="472" height="15" fill="#f8fafc"/>
  <text x="32" y="147" font-size="8" fill="#1e3a5f" font-weight="600">Planes</text><rect x="106" y="138" width="30" height="11" rx="2" fill="#fef9c3"/><text x="121" y="147" text-anchor="middle" font-size="7" fill="#854d0e">POST</text>
  <text x="158" y="147" font-size="8" fill="#475569">/planes/form</text><text x="305" y="147" font-size="8" fill="#475569">Crear plan — formulario (PRG)</text>
  <rect x="20" y="151" width="472" height="15" fill="#fff"/>
  <text x="32" y="162" font-size="8" fill="#1e3a5f" font-weight="600">Planes</text><rect x="106" y="153" width="30" height="11" rx="2" fill="#fef9c3"/><text x="121" y="162" text-anchor="middle" font-size="7" fill="#854d0e">POST</text>
  <text x="158" y="162" font-size="8" fill="#475569">/planes/eliminar/:id</text><text x="305" y="162" font-size="8" fill="#475569">Eliminar plan — formulario (PRG)</text>

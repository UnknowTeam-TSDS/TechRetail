<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sin conexión — TechRetail</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #1e3a8a, #1d4ed8);
      color: #fff; text-align: center; padding: 1.5rem;
    }
    .logo {
      width: 72px; height: 72px; border-radius: 18px;
      background: rgba(255,255,255,0.15);
      display: flex; align-items: center; justify-content: center;
      font-size: 2.5rem; font-weight: 800; margin: 0 auto 1.5rem;
    }
    h1 { font-size: 1.5rem; margin-bottom: 0.75rem; }
    p { font-size: 0.95rem; opacity: 0.85; max-width: 22rem; margin: 0 auto 1.75rem; line-height: 1.5; }
    button {
      background: #fff; color: #1d4ed8; border: 0;
      padding: 0.75rem 1.75rem; border-radius: 0.75rem;
      font-size: 0.9rem; font-weight: 700; cursor: pointer;
    }
    button:hover { background: #eff6ff; }
  </style>
</head>
<body>
  <div>
    <div class="logo">T</div>
    <h1>Sin conexión</h1>
    <p>No pudimos cargar la página. Revisá tu conexión a internet e intentá de nuevo.</p>
    <button onclick="location.reload()">Reintentar</button>
  </div>
</body>
</html>
